<?xml version="1.0" encoding="UTF-8"?>
<svg width="2480" height="3508" viewBox="0 0 2480 3508" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GenAspire Technologies — Java Full-Stack Corporate Training Poster</title>
  <desc id="desc">A modern A4 poster for GenAspire Technologies promoting a 4-month Java Full-Stack corporate training with 100% job assistance. Includes headings, highlights, curriculum roadmap, outcomes, and a QR placeholder for brochure/enrollment.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="55%" stop-color="#1F3A8A"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <style><![CDATA[
      .container { font-family: 'Poppins', 'Inter', 'Segoe UI', Roboto, Arial, sans-serif; }
      .brand { font-weight: 700; letter-spacing: 0.5px; }
      .brand-sub { font-weight: 500; opacity: 0.9; }
      .title { font-weight: 800; letter-spacing: 0.4px; }
      .subtitle { font-weight: 600; opacity: 0.95; }
      .pill { font-weight: 700; letter-spacing: 0.8px; }
      .pill-light { font-weight: 700; }
      .label { font-weight: 700; opacity: 0.9; }
      .body { font-weight: 500; opacity: 0.95; }
      .small { font-weight: 500; opacity: 0.9; }
      .muted { opacity: 0.75; }
      .bullet { font-weight: 700; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="2480" height="3508" fill="url(#bgGradient)"/>
  <rect width="2480" height="3508" fill="url(#glow)"/>
  <rect width="2480" height="3508" fill="url(#glow2)"/>

  <!-- Decorative orbs -->
  <g opacity="0.25">
    <circle cx="2100" cy="400" r="220" fill="#38BDF8"/>
    <circle cx="380" cy="750" r="180" fill="#8B5CF6"/>
    <circle cx="2200" cy="1800" r="260" fill="#22D3EE"/>
  </g>

  <!-- Safe margin guide (invisible) -->
  <g id="safeArea" transform="translate(140, 140)">
    <!-- Header / Brand -->
    <g class="container" transform="translate(0, 0)">
      <!-- Brand mark -->
      <g transform="translate(0, 0)">
        <circle cx="60" cy="60" r="60" fill="rgba(255,255,255,0.08)"/>
        <path d="M40,60 a20,20 0 1,1 40,0 h-18 a2,2 0 0,0 0,4 h20 a2,2 0 0,0 2-2 v-2 a40,40 0 1,0 -40,40 h35 a2,2 0 0,0 0-4 h-35 a36,36 0 1,1 0-72" fill="#A5B4FC" opacity="0.9"/>
      </g>
      <text x="150" y="55" font-size="56" class="brand" fill="#FFFFFF">GenAspire</text>
      <text x="150" y="105" font-size="36" class="brand-sub" fill="#D1D5DB">Technologies</text>
    </g>

    <!-- Hero Title -->
    <g transform="translate(0, 220)" class="container">
      <text x="0" y="0" font-size="140" class="title" fill="#FFFFFF">Java Full‑Stack</text>
      <text x="0" y="120" font-size="86" class="subtitle" fill="#E5E7EB">Corporate Training</text>

      <!-- Pills -->
      <g transform="translate(0, 180)">
        <g filter="url(#shadowSoft)">
          <rect x="0" y="-60" width="560" height="96" rx="48" fill="url(#pillGrad)"/>
        </g>
        <text x="40" y="5" font-size="44" class="pill" fill="#0B1026">100% Job Assistance</text>

        <g transform="translate(600, 0)" filter="url(#shadowSoft)">
          <rect x="0" y="-60" width="380" height="96" rx="48" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)"/>
        </g>
        <text x="640" y="5" font-size="42" class="pill-light" fill="#FFFFFF">Duration: 4 Months</text>
      </g>

      <text x="0" y="300" font-size="40" class="body" fill="#C7D2FE">Cohort‑based • Mentor‑led • Onsite & Virtual • Hands‑on Projects</text>
    </g>

    <!-- Left Column: Outcomes & Highlights -->
    <g transform="translate(0, 680)" class="container">
      <text x="0" y="0" font-size="48" class="label" fill="#FFFFFF">Why this program</text>
      <g transform="translate(0, 40)">
        <g transform="translate(0, 60)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">Build enterprise‑grade applications end‑to‑end</text>
        </g>
        <g transform="translate(0, 120)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">Design REST APIs, microservices, and secure backends</text>
        </g>
        <g transform="translate(0, 180)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">Frontend with React, state, routing, and component patterns</text>
        </g>
        <g transform="translate(0, 240)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">Data persistence with JPA/Hibernate and SQL</text>
        </g>
        <g transform="translate(0, 300)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">CI/CD, Docker, and cloud deployment foundations</text>
        </g>
        <g transform="translate(0, 360)">
          <circle cx="14" cy="-14" r="10" fill="#22D3EE"/>
          <text x="40" y="0" font-size="40" class="body" fill="#E5E7EB">Interview prep, portfolio, and mock interviews</text>
        </g>
      </g>

      <!-- Badges -->
      <g transform="translate(0, 470)">
        <g filter="url(#shadowSoft)">
          <rect x="0" y="0" width="440" height="86" rx="20" fill="rgba(255,255,255,0.12)"/>
        </g>
        <text x="28" y="58" font-size="36" class="small" fill="#FFFFFF">Corporate cohorts • Team‑friendly schedules</text>

        <g transform="translate(470, 0)" filter="url(#shadowSoft)">
          <rect x="0" y="0" width="380" height="86" rx="20" fill="rgba(255,255,255,0.12)"/>
        </g>
        <text x="498" y="58" font-size="36" class="small" fill="#FFFFFF">Certificate of Completion</text>

        <g transform="translate(880, 0)" filter="url(#shadowSoft)">
          <rect x="0" y="0" width="520" height="86" rx="20" fill="rgba(255,255,255,0.12)"/>
        </g>
        <text x="908" y="58" font-size="36" class="small" fill="#FFFFFF">Capstone + Resume & LinkedIn support</text>
      </g>
    </g>

    <!-- Right Column: 4-Month Roadmap -->
    <g transform="translate(1260, 680)" class="container">
      <text x="0" y="0" font-size="48" class="label" fill="#FFFFFF">Program roadmap (4 months)</text>
      <g transform="translate(0, 60)">
        <!-- Timeline spine -->
        <rect x="20" y="0" width="8" height="940" fill="rgba(255,255,255,0.18)"/>

        <!-- Month 1 -->
        <g transform="translate(0, 20)">
          <circle cx="24" cy="0" r="16" fill="#22D3EE"/>
          <text x="60" y="12" font-size="42" class="subtitle" fill="#E0E7FF">Month 1 — Core Java & OOP</text>
          <text x="60" y="72" font-size="36" class="small" fill="#C7D2FE">Java 17, Collections, Generics, Streams, Concurrency</text>
          <text x="60" y="116" font-size="36" class="small" fill="#C7D2FE">Testing with JUnit, Clean code, Design patterns</text>
        </g>

        <!-- Month 2 -->
        <g transform="translate(0, 220)">
          <circle cx="24" cy="0" r="16" fill="#22D3EE"/>
          <text x="60" y="12" font-size="42" class="subtitle" fill="#E0E7FF">Month 2 — Spring Boot & Data</text>
          <text x="60" y="72" font-size="36" class="small" fill="#C7D2FE">REST APIs, Validation, Spring Security (JWT)</text>
          <text x="60" y="116" font-size="36" class="small" fill="#C7D2FE">JPA/Hibernate, SQL (PostgreSQL/MySQL), Caching</text>
        </g>

        <!-- Month 3 -->
        <g transform="translate(0, 420)">
          <circle cx="24" cy="0" r="16" fill="#22D3EE"/>
          <text x="60" y="12" font-size="42" class="subtitle" fill="#E0E7FF">Month 3 — Frontend with React</text>
          <text x="60" y="72" font-size="36" class="small" fill="#C7D2FE">Components, Hooks, Routing, Forms</text>
          <text x="60" y="116" font-size="36" class="small" fill="#C7D2FE">API integration, Auth flows, UI patterns</text>
        </g>

        <!-- Month 4 -->
        <g transform="translate(0, 620)">
          <circle cx="24" cy="0" r="16" fill="#22D3EE"/>
          <text x="60" y="12" font-size="42" class="subtitle" fill="#E0E7FF">Month 4 — Microservices, DevOps & Cloud</text>
          <text x="60" y="72" font-size="36" class="small" fill="#C7D2FE">Microservices, Docker, CI/CD, Observability</text>
          <text x="60" y="116" font-size="36" class="small" fill="#C7D2FE">Deploy to cloud (AWS/Azure) • Capstone project</text>
        </g>

        <!-- Support -->
        <g transform="translate(0, 860)">
          <circle cx="24" cy="0" r="16" fill="#22D3EE"/>
          <text x="60" y="12" font-size="42" class="subtitle" fill="#E0E7FF">Career support — 100% Job Assistance</text>
          <text x="60" y="72" font-size="36" class="small" fill="#C7D2FE">Mock interviews, coding drills, referral network, 1:1 feedback</text>
        </g>
      </g>
    </g>

    <!-- CTA strip -->
    <g transform="translate(0, 2000)" class="container">
      <g filter="url(#shadowMedium)">
        <rect x="0" y="0" width="2200" height="380" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
      </g>
      <text x="60" y="110" font-size="52" class="label" fill="#FFFFFF">Ready to upskill your team?</text>
      <text x="60" y="180" font-size="40" class="body" fill="#E5E7EB">Corporate & group pricing • Weekday/Weekend cohorts • Onsite & Virtual delivery</text>
      <g transform="translate(60, 220)">
        <g filter="url(#shadowSoft)">
          <rect x="0" y="0" width="420" height="96" rx="16" fill="url(#pillGrad)"/>
        </g>
        <text x="30" y="64" font-size="40" class="pill" fill="#0B1026">Enroll Now</text>
      </g>

      <!-- QR Placeholder -->
      <g transform="translate(1750, 40)">
        <rect x="0" y="0" width="320" height="320" rx="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)"/>
        <rect x="40" y="40" width="240" height="240" fill="rgba(255,255,255,0.2)"/>
        <text x="160" y="170" text-anchor="middle" font-size="28" class="small" fill="#0B1026">QR CODE</text>
        <text x="160" y="280" text-anchor="middle" font-size="26" class="small" fill="#FFFFFF">Scan for brochure & enrollment</text>
      </g>
    </g>

    <!-- Footer -->
    <g transform="translate(0, 2440)" class="container muted">
      <text x="0" y="0" font-size="32" class="small" fill="#E5E7EB">Customize: add your cohort start date, location, and QR linked to your form</text>
      <text x="0" y="50" font-size="30" class="small" fill="#E5E7EB">© GenAspire Technologies — Java, Spring Boot, React are respective trademarks of their owners.</text>
    </g>
  </g>
</svg>
